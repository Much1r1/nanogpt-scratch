data:
  path: "data/tiny_shakespeare.txt"
  train_ratio: 0.9

model:
  n_embd: 64
  n_layer: 4
  n_head: 4
  block_size: 64
  dropout: 0.0

training:
  batch_size: 32
  learning_rate: 1e-3
  max_steps: 500
  eval_interval: 50
  eval_iters: 10
  seed: 1337
  device: "cpu"
  checkpoint_dir: "checkpoints"
  checkpoint_interval: 100
